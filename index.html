<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Adventure - Phiêu Lưu Rừng Xanh</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            background-color: #3b82a6;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
            border: 4px solid #1a1a2e;
            border-radius: 12px;
            background: #a2ded0;
        }
        canvas {
            display: block;
        }
        .footer-info {
            margin-top: 14px;
            font-size: 14px;
            color: #e0e0e0;
            text-align: center;
            line-height: 1.5;
            text-shadow: 1px 1px #000;
        }
        kbd {
            background-color: #222;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>
    <div class="footer-info">
        🌿 <b>Điều khiển:</b> Dùng phím <kbd>←</kbd> <kbd>→</kbd> để di chuyển | <kbd>SPACE</kbd> hoặc <kbd>↑</kbd> để Nhảy<br>
        ⚔️️ <b>Đánh quái:</b> Nhảy đạp lên đầu quái vật để tiêu diệt chúng | Thu thập trái tim, tiền xu và đá quý!
    </div>

<script>
    class SoundFX {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }
        playJump() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } catch(e) {}
        }
        playStomp() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            } catch(e) {}
        }
        playCoin() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1200, this.ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            } catch(e) {}
        }
        playDie() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.4);
                
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            } catch(e) {}
        }
    }

    const sfx = new SoundFX();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = 'start';
    let score = 0;
    let coins = 0;
    let gems = 0;
    let hp = 3;

    const GRAVITY = 0.65;
    const WORLD_WIDTH = 3500;
    const GROUND_Y = 440;

    let player = {
        x: 100,
        y: 200,
        width: 34,
        height: 42,
        vx: 0,
        vy: 0,
        speed: 4.2,
        jumpForce: -13.5,
        onGround: false,
        facing: 'right'
    };

    let cameraX = 0;
    let keys = {};
    let platforms = [];
    let enemies = [];
    let collectibles = [];
    let trees = [];

    function initLevel() {
        platforms = [];
        enemies = [];
        collectibles = [];
        trees = [];

        platforms.push({ x: 0, y: GROUND_Y, width: 850, height: 100, type: 'ground' });
        platforms.push({ x: 960, y: GROUND_Y, width: 1100, height: 100, type: 'ground' });
        platforms.push({ x: 2180, y: GROUND_Y, width: 1320, height: 100, type: 'ground' });

        platforms.push({ x: 300, y: 320, width: 220, height: 35, type: 'platform' });
        platforms.push({ x: 600, y: 240, width: 280, height: 35, type: 'platform' });
        platforms.push({ x: 980, y: 310, width: 250, height: 35, type: 'platform' });
        platforms.push({ x: 1300, y: 210, width: 300, height: 35, type: 'platform' });
        platforms.push({ x: 1750, y: 290, width: 240, height: 35, type: 'platform' });
        platforms.push({ x: 2250, y: 220, width: 280, height: 35, type: 'platform' });
        platforms.push({ x: 2700, y: 300, width: 260, height: 35, type: 'platform' });

        trees.push({ x: 150, y: GROUND_Y - 120 });
        trees.push({ x: 1100, y: GROUND_Y - 120 });
        trees.push({ x: 1950, y: GROUND_Y - 120 });
        trees.push({ x: 2800, y: GROUND_Y - 120 });

        enemies.push({ x: 650, y: GROUND_Y - 36, width: 36, height: 36, vx: -1.5, alive: true, type: 'bug' });
        enemies.push({ x: 1150, y: 310 - 36, width: 36, height: 36, vx: 1.2, alive: true, type: 'bug' });
        enemies.push({ x: 1450, y: GROUND_Y - 36, width: 36, height: 36, vx: -1.8, alive: true, type: 'plant' });
        enemies.push({ x: 1900, y: GROUND_Y - 36, width: 36, height: 36, vx: -1.5, alive: true, type: 'bug' });
        enemies.push({ x: 2400, y: 220 - 36, width: 36, height: 36, vx: 1.4, alive: true, type: 'bug' });
        enemies.push({ x: 2850, y: GROUND_Y - 36, width: 36, height: 36, vx: -1.6, alive: true, type: 'plant' });

        collectibles.push({ x: 380, y: 270, type: 'coin', collected: false });
        collectibles.push({ x: 420, y: 270, type: 'coin', collected: false });
        collectibles.push({ x: 700, y: 180, type: 'gem', collected: false });
        collectibles.push({ x: 1050, y: 250, type: 'heart', collected: false });
        collectibles.push({ x: 1420, y: 150, type: 'gem', collected: false });
        collectibles.push({ x: 1850, y: 230, type: 'coin', collected: false });
        collectibles.push({ x: 1890, y: 230, type: 'coin', collected: false });
        collectibles.push({ x: 2380, y: 160, type: 'gem', collected: false });
        collectibles.push({ x: 2820, y: 240, type: 'heart', collected: false });
    }

    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        sfx.init();

        if (["Space", "ArrowUp"].includes(e.code)) {
            e.preventDefault();
            if (gameState === 'playing' && player.onGround) {
                player.vy = player.jumpForce;
                player.onGround = false;
                sfx.playJump();
            } else if (gameState === 'start' || gameState === 'gameover' || gameState === 'victory') {
                startGame();
            }
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    canvas.addEventListener("mousedown", () => {
        sfx.init();
        if (gameState === 'start' || gameState === 'gameover' || gameState === 'victory') {
            startGame();
        } else if (gameState === 'playing' && player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
            sfx.playJump();
        }
    });

    function startGame() {
        gameState = 'playing';
        score = 0;
        coins = 0;
        gems = 0;
        hp = 3;
        player.x = 100;
        player.y = 200;
        player.vx = 0;
        player.vy = 0;
        initLevel();
    }

    function hurtPlayer() {
        hp--;
        sfx.playDie();
        player.y -= 30;
        player.vy = -8;
        if (hp <= 0) {
            gameState = 'gameover';
        }
    }

    function update() {
        if (gameState !== 'playing') return;

        player.vx = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) {
            player.vx = -player.speed;
            player.facing = 'left';
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
            player.vx = player.speed;
            player.facing = 'right';
        }

        player.vy += GRAVITY;

        player.x += player.vx;
        for (let p of platforms) {
            if (checkCollision(player, { x: p.x, y: p.y, width: p.width, height: p.height })) {
                if (player.vx > 0) player.x = p.x - player.width;
                else if (player.vx < 0) player.x = p.x + p.width;
            }
        }

        player.onGround = false;
        player.y += player.vy;
        for (let p of platforms) {
            if (checkCollision(player, { x: p.x, y: p.y, width: p.width, height: p.height })) {
                if (player.vy > 0) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0) {
                    player.y = p.y + p.height;
                    player.vy = 0;
                }
            }
        }

        cameraX = player.x - 300;
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));

        if (player.y > canvas.height + 50) {
            hurtPlayer();
            if (gameState === 'playing') {
                player.x = Math.max(50, cameraX + 50);
                player.y = 100;
            }
        }

        for (let e of enemies) {
            if (!e.alive) continue;
            e.x += e.vx;

            for (let p of platforms) {
                if (checkCollision(e, { x: p.x, y: p.y, width: p.width, height: p.height })) {
                    e.vx *= -1;
                }
            }

            if (checkCollision(player, e)) {
                if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 15) {
                    e.alive = false;
                    player.vy = -9;
                    score += 200;
                    sfx.playStomp();
                } else {
                    hurtPlayer();
                }
            }
        }

        for (let c of collectibles) {
            if (!c.collected && checkCollision(player, { x: c.x - 12, y: c.y - 12, width: 24, height: 24 })) {
                c.collected = true;
                sfx.playCoin();
                if (c.type === 'coin') { coins++; score += 100; }
                else if (c.type === 'gem') { gems++; score += 500; }
                else if (c.type === 'heart') { hp = Math.min(5, hp + 1); score += 300; }
            }
        }

        if (player.x >= WORLD_WIDTH - 150) {
            gameState = 'victory';
        }
    }

    function checkCollision(r1, r2) {
        return r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'start') {
            drawStartScreen();
            return;
        }

        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, "#4ba3e3");
        skyGrad.addColorStop(1, "#a2ded0");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.fillRect(200 - cameraX * 0.3, 60, 120, 35);
        ctx.fillRect(700 - cameraX * 0.3, 90, 150, 35);
        ctx.fillRect(1300 - cameraX * 0.3, 50, 130, 35);
        ctx.fillRect(2100 - cameraX * 0.3, 80, 160, 35);

        for (let t of trees) {
            let tx = t.x - cameraX;
            if (tx > -150 && tx < canvas.width + 150) {
                ctx.fillStyle = "#8b5a2b";
                ctx.fillRect(tx + 15, t.y + 30, 20, 90);
                ctx.fillStyle = "#2e8b57";
                ctx.beginPath();
                ctx.arc(tx + 25, t.y + 25, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let p of platforms) {
            let dx = p.x - cameraX;
            if (dx > -200 && dx < canvas.width + 200) {
                ctx.fillStyle = "#8c5830";
                ctx.fillRect(dx, p.y + 12, p.width, p.height - 12);
                ctx.fillStyle = "#43b326";
                ctx.fillRect(dx, p.y, p.width, 16);
                ctx.fillStyle = "#2d8515";
                for (let gx = dx; gx < dx + p.width; gx += 16) {
                    ctx.beginPath();
                    ctx.moveTo(gx, p.y);
                    ctx.lineTo(gx + 8, p.y - 8);
                    ctx.lineTo(gx + 16, p.y);
                    ctx.fill();
                }
            }
        }

        for (let c of collectibles) {
            if (c.collected) continue;
            let cx = c.x - cameraX;
            if (cx > -50 && cx < canvas.width + 50) {
                if (c.type === 'coin') {
                    ctx.fillStyle = "#ffd700";
                    ctx.beginPath(); ctx.arc(cx, c.y, 11, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = "#b8860b"; ctx.lineWidth = 2; ctx.stroke();
                } else if (c.type === 'gem') {
                    ctx.fillStyle = "#ff00ff";
                    ctx.beginPath();
                    ctx.moveTo(cx, c.y - 12);
                    ctx.lineTo(cx + 10, c.y);
                    ctx.lineTo(cx, c.y + 12);
                    ctx.lineTo(cx - 10, c.y);
                    ctx.closePath();
                    ctx.fill();
                } else if (c.type === 'heart') {
                    ctx.fillStyle = "#ff3344";
                    ctx.font = "20px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("❤️", cx, c.y + 7);
                }
            }
        }

        for (let e of enemies) {
            if (!e.alive) continue;
            let ex = e.x - cameraX;
            if (ex > -50 && ex < canvas.width + 50) {
                if (e.type === 'bug') {
                    ctx.fillStyle = "#ff3333";
                    ctx.beginPath(); ctx.arc(ex + 18, e.y + 18, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(ex + 8, e.y + 8, 6, 8);
                    ctx.fillRect(ex + 20, e.y + 8, 6, 8);
                    ctx.fillStyle = "#000";
                    ctx.fillRect(ex + 10, e.y + 11, 3, 4);
                    ctx.fillRect(ex + 22, e.y + 11, 3, 4);
                } else {
                    ctx.fillStyle = "#cc0000";
                    ctx.fillRect(ex + 6, e.y + 12, 24, 24);
                    ctx.fillStyle = "#00ff66";
                    ctx.fillRect(ex + 12, e.y, 14, 14);
                }
            }
        }

        let flagX = WORLD_WIDTH - 150 - cameraX;
        ctx.fillStyle = "#fff";
        ctx.fillRect(flagX, GROUND_Y - 220, 8, 220);
        ctx.fillStyle = "#ffd700";
        ctx.beginPath(); ctx.arc(flagX + 4, GROUND_Y - 220, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff3333";
        ctx.beginPath();
        ctx.moveTo(flagX + 8, GROUND_Y - 210);
        ctx.lineTo(flagX + 65, GROUND_Y - 185);
        ctx.lineTo(flagX + 8, GROUND_Y - 160);
        ctx.closePath();
        ctx.fill();

        let px = player.x - cameraX;
        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(px + 4, player.y + 6, 26, 20);
        ctx.fillStyle = "#0066cc";
        ctx.fillRect(px + 6, player.y + 26, 22, 16);
        ctx.fillStyle = "#ffcc99";
        ctx.fillRect(player.facing === 'right' ? px + 18 : px + 4, player.y + 10, 12, 12);

        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(15, 15, 340, 45);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, 340, 45);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "left";
        ctx.fillText(`❤️ HP: ${"❤️".repeat(hp)}`, 30, 43);
        ctx.fillText(`🪙 ${coins}`, 150, 43);
        ctx.fillText(`💎 ${gems}`, 220, 43);
        ctx.fillText(`🏆 ${score}`, 280, 43);

        if (gameState === 'gameover' || gameState === 'victory') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            
            if (gameState === 'gameover') {
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 44px Arial";
                ctx.fillText("BẠN ĐÃ THẤT BẠI!", canvas.width / 2, canvas.height / 2 - 25);
            } else {
                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 44px Arial";
                ctx.fillText("HOÀN THÀNH PHIÊU LƯU!", canvas.width / 2, canvas.height / 2 - 25);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.fillText(`Tổng điểm: ${score} | Tiền vàng: ${coins} | Đá quý: ${gems}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.font = "16px Arial";
            ctx.fillStyle = "#ffcc00";
            ctx.fillText("Nhấn SPACE hoặc Click chuột để chơi lại", canvas.width / 2, canvas.height / 2 + 70);
        }
    }

    function drawStartScreen() {
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, "#4ba3e3");
        skyGrad.addColorStop(1, "#a2ded0");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#228b22";
        ctx.font = "bold 52px Arial";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 10;
        ctx.fillText("JUNGLE ADVENTURE", canvas.width / 2, 160);
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Arial";
        ctx.fillText("Khám phá khu rừng nhiệt đới, thu thập kho báu và tiêu diệt quái vật!", canvas.width / 2, 215);

        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(canvas.width / 2 - 120, 270, 240, 65);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.strokeRect(canvas.width / 2 - 120, 270, 240, 65);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px Arial";
        ctx.fillText("BẮT ĐẦU CHƠI", canvas.width / 2, 312);

        ctx.fillStyle = "#fff";
        ctx.font = "15px Arial";
        ctx.fillText("Nhấn SPACE hoặc Click chuột để bắt đầu", canvas.width / 2, 380);
        ctx.textAlign = "left";
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
