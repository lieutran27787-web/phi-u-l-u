<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Adventure - Đánh Quái Phiêu Lưu</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            background-color: #12121c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 100, 0, 0.4);
            border: 4px solid #3d2c1d;
            border-radius: 12px;
            background: #1a1a24;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        .footer-info {
            margin-top: 14px;
            font-size: 14px;
            color: #b0a8c0;
            text-align: center;
            line-height: 1.5;
        }
        kbd {
            background-color: #2a2a38;
            border: 1px solid #4a4a60;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            color: #ffaa00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>
    <div class="footer-info">
        ⚔️ <b>Điều khiển:</b> Dùng phím <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> hoặc <kbd>Mũi tên</kbd> để di chuyển<br>
        🗡️️ Nhấn <kbd>SPACE</kbd> hoặc <kbd>Click Chuột Trái</kbd> để Tấn công quái vật | 🧪 Nhấn <kbd>E</kbd> để dùng Bình máu
    </div>

<script>
    class SoundFX {
        constructor() {
            this.ctx = null;
        }
        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }
        playSlash() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } catch(e) {}
        }
        playHit() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            } catch(e) {}
        }
        playCoin() {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1300, this.ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            } catch(e) {}
        }
    }

    const sfx = new SoundFX();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = 'menu';
    let currentWave = 1;
    let score = 0;
    let gold = 0;

    let player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        size: 32,
        speed: 3.8,
        maxHp: 100,
        hp: 100,
        attack: 25,
        potions: 3,
        facing: 'right',
        isAttacking: false,
        attackTimer: 0,
        invulnerableTimer: 0
    };

    let keys = {};
    let enemies = [];
    let particles = [];
    let floatingTexts = [];
    let items = [];

    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        sfx.init();

        if (e.code === "Space") {
            e.preventDefault();
            if (gameState === 'playing') {
                playerAttack();
            } else if (gameState === 'gameover' || gameState === 'victory') {
                resetGame();
            }
        }
        if (e.code === "KeyE" && gameState === 'playing') {
            usePotion();
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    canvas.addEventListener("mousedown", (e) => {
        sfx.init();
        if (gameState === 'menu') {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            if (mx >= canvas.width / 2 - 100 && mx <= canvas.width / 2 + 100 &&
                my >= canvas.height / 2 + 40 && my <= canvas.height / 2 + 100) {
                startGame();
            }
        } else if (gameState === 'playing') {
            playerAttack();
        } else if (gameState === 'gameover' || gameState === 'victory') {
            resetGame();
        }
    });

    function startGame() {
        gameState = 'playing';
        currentWave = 1;
        score = 0;
        gold = 0;
        player.hp = player.maxHp;
        player.potions = 3;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        enemies = [];
        particles = [];
        items = [];
        spawnWave();
    }

    function resetGame() {
        gameState = 'menu';
    }

    function spawnWave() {
        enemies = [];
        let enemyCount = 3 + currentWave * 2;
        for (let i = 0; i < enemyCount; i++) {
            let typeRand = Math.random();
            let type = 'slime';
            let hp = 40 + currentWave * 10;
            let speed = 1.5 + Math.random() * 0.8;
            let size = 28;
            let color = '#00ff66';

            if (currentWave >= 2 && typeRand > 0.5) {
                type = 'goblin';
                hp = 60 + currentWave * 15;
                speed = 2.2;
                size = 32;
                color = '#ff9900';
            }
            if (currentWave >= 3 && typeRand > 0.85) {
                type = 'orc';
                hp = 120 + currentWave * 25;
                speed = 1.1;
                size = 42;
                color = '#cc0000';
            }

            let ex, ey;
            do {
                ex = Math.random() * (canvas.width - 100) + 50;
                ey = Math.random() * (canvas.height - 100) + 50;
            } while (Math.hypot(ex - player.x, ey - player.y) < 200);

            enemies.push({
                x: ex, y: ey, size: size, hp: hp, maxHp: hp, speed: speed, type: type, color: color
            });
        }
    }

    function playerAttack() {
        if (player.isAttacking) return;
        player.isAttacking = true;
        player.attackTimer = 12;
        sfx.playSlash();

        let attackRange = 55;
        for (let e of enemies) {
            let dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist < 75) {
                e.hp -= player.attack;
                createHitParticles(e.x, e.y);
                addFloatingText("-" + player.attack, e.x, e.y - 20, "#ff3333");
                sfx.playHit();

                let angle = Math.atan2(e.y - player.y, e.x - player.x);
                e.x += Math.cos(angle) * 25;
                e.y += Math.sin(angle) * 25;
            }
        }
    }

    function usePotion() {
        if (player.potions > 0 && player.hp < player.maxHp) {
            player.potions--;
            player.hp = Math.min(player.maxHp, player.hp + 50);
            addFloatingText("+50 HP", player.x, player.y - 30, "#00ff66");
            sfx.playCoin();
        }
    }

    function addFloatingText(text, x, y, color) {
        floatingTexts.push({ text, x, y, color, life: 35 });
    }

    function createHitParticles(x, y) {
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                size: Math.random() * 4 + 2,
                color: "#ff3300",
                life: 20
            });
        }
    }

    function update() {
        if (gameState !== 'playing') return;

        let dx = 0;
        let dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) { dx -= 1; player.facing = 'left'; }
        if (keys['KeyD'] || keys['ArrowRight']) { dx += 1; player.facing = 'right'; }

        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        player.x += dx * player.speed;
        player.y += dy * player.speed;

        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
        player.y = Math.max(50, Math.min(canvas.height - 20, player.y));

        if (player.isAttacking) {
            player.attackTimer--;
            if (player.attackTimer <= 0) player.isAttacking = false;
        }

        if (player.invulnerableTimer > 0) {
            player.invulnerableTimer--;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 1; ft.life--;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * e.speed;
            e.y += Math.sin(angle) * e.speed;

            let dist = Math.hypot(player.x - e.x, player.y - e.y);
            if (dist < player.size / 2 + e.size / 2) {
                if (player.invulnerableTimer === 0) {
                    let dmg = e.type === 'orc' ? 25 : (e.type === 'goblin' ? 15 : 10);
                    player.hp -= dmg;
                    player.invulnerableTimer = 45;
                    sfx.playHit();
                    addFloatingText("-" + dmg, player.x, player.y - 25, "#ff0000");

                    if (player.hp <= 0) {
                        gameState = 'gameover';
                    }
                }
            }

            if (e.hp <= 0) {
                score += e.type === 'orc' ? 50 : (e.type === 'goblin' ? 30 : 15);
                gold += Math.floor(Math.random() * 5) + 2;
                
                if (Math.random() > 0.6) {
                    items.push({ x: e.x, y: e.y, type: 'potion' });
                }

                enemies.splice(i, 1);
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let it = items[i];
            if (Math.hypot(player.x - it.x, player.y - it.y) < 30) {
                player.potions++;
                sfx.playCoin();
                addFloatingText("+1 Potion", player.x, player.y - 30, "#00ffcc");
                items.splice(i, 1);
            }
        }

        if (enemies.length === 0) {
            currentWave++;
            if (currentWave > 5) {
                gameState = 'victory';
            } else {
                spawnWave();
                addFloatingText(`WAVE ${currentWave} START!`, canvas.width / 2, 100, "#ffcc00");
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#161622";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#222233";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        if (gameState === 'menu') {
            drawMenu();
            return;
        }

        for (let it of items) {
            ctx.fillStyle = "#ff0066";
            ctx.beginPath();
            ctx.arc(it.x, it.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🧪", it.x, it.y + 4);
        }

        for (let e of enemies) {
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(e.x - 6, e.y - 6, 4, 4);
            ctx.fillRect(e.x + 2, e.y - 6, 4, 4);

            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(e.x - 20, e.y - e.size / 2 - 12, 40, 6);
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(e.x - 20, e.y - e.size / 2 - 12, (40 * e.hp) / e.maxHp, 6);
        }

        if (player.invulnerableTimer % 6 < 3) {
            ctx.fillStyle = "#3399ff";
            ctx.fillRect(player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);

            if (player.isAttacking) {
                ctx.fillStyle = "#ffff00";
                let swordX = player.facing === 'right' ? player.x + 20 : player.x - 45;
                ctx.fillRect(swordX, player.y - 12, 25, 24);
            }
        }

        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }

        for (let ft of floatingTexts) {
            ctx.fillStyle = ft.color;
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText(ft.text, ft.x, ft.y);
        }

        ctx.fillStyle = "rgba(10, 10, 20, 0.8)";
        ctx.fillRect(0, 0, canvas.width, 50);
        ctx.strokeStyle = "#3d2c1d";
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, canvas.width, 50);

        ctx.fillStyle = "#444";
        ctx.fillRect(20, 15, 180, 20);
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(20, 15, (180 * Math.max(0, player.hp)) / player.maxHp, 20);
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(20, 15, 180, 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, 110, 30);

        ctx.font = "bold 16px Arial";
        ctx.textAlign = "left";
        ctx.fillStyle = "#ffaa00";
        ctx.fillText(`⚔️ Wave: ${currentWave} / 5`, 230, 30);
        ctx.fillStyle = "#00ccff";
        ctx.fillText(`💰 Vàng: ${gold}`, 390, 30);
        ctx.fillStyle = "#ff33cc";
        ctx.fillText(`🧪 Bình máu (E): ${player.potions}`, 510, 30);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(`🏆 Điểm: ${score}`, 700, 30);

        if (gameState === 'gameover' || gameState === 'victory') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            
            if (gameState === 'gameover') {
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 48px Arial";
                ctx.fillText("BẠN ĐÃ HY SINH!", canvas.width / 2, canvas.height / 2 - 30);
            } else {
                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 48px Arial";
                ctx.fillText("CHIẾN THẮNG HOÀNH TRÁNG!", canvas.width / 2, canvas.height / 2 - 30);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.fillText(`Tổng điểm đạt được: ${score} | Vàng thu thập: ${gold}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.font = "16px Arial";
            ctx.fillStyle = "#ffaa00";
            ctx.fillText("Nhấn SPACE hoặc Click chuột để chơi lại", canvas.width / 2, canvas.height / 2 + 70);
        }
    }

    function drawMenu() {
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff6600";
        ctx.font = "bold 56px Arial";
        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 20;
        ctx.fillText("EPIC DUNGEON ADVENTURE", canvas.width / 2, 160);
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#b0a8c0";
        ctx.font = "18px Arial";
        ctx.fillText("Khám phá hầm ngục bí ẩn, tiêu diệt quái vật và trở thành chiến binh huyền thoại!", canvas.width / 2, 210);

        ctx.fillStyle = "#ff4400";
        ctx.fillRect(canvas.width / 2 - 110, canvas.height / 2 + 30, 220, 65);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 110, canvas.height / 2 + 30, 220, 65);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px Arial";
        ctx.fillText("BẮT ĐẦU CHƠI", canvas.width / 2, canvas.height / 2 + 72);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
